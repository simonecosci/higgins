# Copy this file to config.yml and customise it. config.yml must not go in git
# (it's already in .gitignore): it holds your site's real domain and paths.

ssh: my-vps                            # alias in ~/.ssh/config, or "user@host"
path: /var/www/example.com/wordpress   # absolute path of the WordPress installation
cli: sudo -u www-data wp               # user owning the files (avoids root-owned files
                                        # inside wp-content); alternative: "wp --allow-root"
author: 1                              # ID of the WordPress user signing the content
                                        # (read it with: wp user list --fields=ID,user_login)
